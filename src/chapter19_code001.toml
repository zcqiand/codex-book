# 从第 19 章提取
# 来源：Codex 从入门到项目实践
# .codex/workflows/code-review.toml —— 代码审查工作流（Codex CLI v2026-05+）
[[workflows]]
name = "code-review"
description = "标准代码审查流程：/review → 修复批注 → 运行测试 → 暂存提交"

[[workflows.steps]]
command = "/review"
args = { focus = ["security", "error-handling"] }

[[workflows.steps]]
command = "/agent"
args = { prompt = "修复所有内联批注，保持修改范围最小化" }

[[workflows.steps]]
command = "bash"
args = { command = "npm test" }

[[workflows.steps]]
command = "bash"
args = { command = "git add -A && git commit -m 'fix: 根据审查批注修复' && git push" }