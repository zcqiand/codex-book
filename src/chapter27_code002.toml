# requirements.toml 中的 OpenTelemetry 配置
[otel]
enabled = true
exporter_type = "otlp"
endpoint = "https://otel-collector.internal.example.com:4317"
protocol = "grpc"

[otel.tls]
enabled = true
ca_file = "/opt/codex-managed/certs/otel-ca.pem"

[otel.headers]
# 在 OTLP 请求中注入 API Key 用于后端认证
x-api-key = "${OTEL_API_KEY}"