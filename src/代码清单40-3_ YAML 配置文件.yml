
name: parent-weekly-report
schedule: "0 20 * * 5"   # 每周五晚 20:00（家长下班后看到）
action:
  type: agent
  agent: planner
  prompt: >
    为所有学生生成家长周报，执行以下步骤：

    1. 对每个学生，调用 compute_learning_metrics() 计算三大指标
    2. 对比上周指标，计算变化量（掌握度变化、进步率变化）
    3. 调用 $imagegen 生成本周学习曲线图（附在上周曲线旁做对比）
    4. 根据薄弱点 Top 3，从题库中推荐 3 道针对性练习题
    5. 组装报告：指标摘要 → 趋势说明 → 图表对比 → 练习推荐 → 鼓励语
    
    报告要求：
    - 语言用「您孩子」而非「学生XXX」——家长视角
    - 进步时用「🎯 本周亮点」，退步时用「💡 建议关注」
    - 每个指标附带一句话解读（不超过 20 字）
    - 图表对比（本周 vs 上周）放在报告顶部——这是家长最关心的部分

  notify:
    channels: ["#parent-reports"]
    summary: true

---
name: parent-report-preference-check
schedule: "0 10 1 * *"   # 每月1日 10:00 检查推送偏好
action:
  type: agent
  agent: planner
  prompt: >
    检查所有家长的推送偏好设置（从 Memory 读取 parent:{id}:preferences）：
    1. 推送频率偏好为「每周」的家长 → 保持当前推送节奏
    2. 推送频率偏好为「每月」的家长 → 本周跳过推送，在报告中标注「下次推送：月底」
    3. 推送偏好未设置的家长 → 在报告中附加一句话：
       「如需调整推送频率（每周/每月），请回复本消息设置」
    4. 汇总本次推送的家长数量和被跳过的家长数量，记录到 Memory

  notify:
    channels: ["#system-log"]