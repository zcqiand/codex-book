# 从第 27 章提取
# 来源：Codex 从入门到项目实践
# 管理员部署的 requirements.toml
[security]
# 强制沙箱为 workspace-write——用户不能降级为 read-only 或 danger-full-access
sandbox = "workspace-write"

[security.approval]
# 审批策略强制为 never——在 CI 和 Automation 中不用等待人工审批
policy = "never"

[tools]
disabled = ["Bash(rm -rf /:*)", "Bash(sudo:*)", "Bash(curl * | bash)"]

[model]
# 限制使用轻量模型以控制成本——禁止使用 xhigh 推理力度
max_reasoning_effort = "high"