name: Codex PR Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: openai/codex-github-action@v1
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            审查这个 PR 的代码变更。
            关注：逻辑错误、安全漏洞、边界条件遗漏。
            如果有问题，直接修改代码并提交修复。