# 从第 27 章提取
# 来源：Codex 从入门到项目实践
# requirements.toml 中定义的 Managed Hook
[hooks]
  [hooks.PreToolUse]
    [hooks.PreToolUse.security_check]
    command = "node"
    args = ["/opt/codex-managed/hooks/security-check.js"]
    matcher = "Bash.*"
    timeout = 10000

  [hooks.PostToolUse]
    [hooks.PostToolUse.audit_log]
    command = "python"
    args = ["/opt/codex-managed/hooks/audit.py"]
    matcher = ".*"